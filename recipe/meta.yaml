{% set name = "glib-networking" %}
{% set version = "2.80.1" %}
{% set version_majmin = '.'.join(version.split('.', 2)[:2]) %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://download.gnome.org/sources/{{ name }}/{{ version_majmin }}/{{ name }}-{{ version }}.tar.xz
  sha256: b80e2874157cd55071f1b6710fa0b911d5ac5de106a9ee2a4c9c7bee61782f8e

build:
  number: 0
  run_exports:
    # Following glib's pinnings
    - {{ pin_subpackage('glib-networking') }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - gettext     # [osx and (build_platform != target_platform)]
    - meson
    - ninja
    - pkg-config
  host:
    - gettext  # [osx]
    - glib
    - openssl
    - zlib
  run:
    - gettext
    # The post-link scripts need glib
    # The glib run_export should help us constrain the version
    - glib
    - openssl

test:
  commands:
    - test -f ${PREFIX}/lib/gio/modules/libgioopenssl.so                  # [unix]
    - if not exist %LIBRARY_LIB%\\gio\\modules\\gioopenssl.dll exit 1     # [win]
  downstreams:
    - libsoup

about:
  home: https://gitlab.gnome.org/GNOME/glib-networking
  license: LGPL-2.1-or-later
  license_family: LGPL
  license_file: COPYING
  summary: Network related modules for glib

extra:
  recipe-maintainers:
    - tschoonj
